<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e304a" />
    <title>삼육이 — 자동화평가 설명·이의제기 지원 서비스</title>
    <meta
      name="description"
      content="삼육이는 신용정보법 제36조의2가 보장하는 자동화평가 설명 요구·유리한 정보 제출·정정 및 재산출 요구를 실제로 행사할 수 있게 돕습니다. 회원가입이 없고, 작성하신 내용을 서버에 저장하지 않습니다."
    />

    <!--
      링크 미리보기(메신저·문서에 주소를 붙였을 때).
      ★ og:url 과 og:image 는 절대 주소여야 한다. 상대 경로는 미리보기에서 뜨지 않는다.
        정적 HTML 이라 상수로 뺄 수 없다. 대표 URL 이 바뀌면 여기 세 줄과 CLAUDE.md 를 함께 고친다.
        (autoevalrights.vercel.app 로 들어와도 미리보기 카드는 대표 주소를 가리킨다 — 같은 배포다)
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="삼육이" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://362.parkmiyeong.com/" />
    <meta property="og:title" content="삼육이 — 자동화평가 설명·이의제기 지원 서비스" />
    <meta
      property="og:description"
      content="AI가 내린 대출·카드 심사 결과에 설명을 요구하고, 유리한 정보를 내고, 다시 계산해 달라고 요구할 수 있습니다. 신용정보법 제36조의2. 회원가입 없이 바로 쓰실 수 있습니다."
    />
    <meta property="og:image" content="https://362.parkmiyeong.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="삼육이 — 대출이 거절됐을 때, 이유를 물어볼 법적 권리가 있습니다"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="삼육이 — 자동화평가 설명·이의제기 지원 서비스" />
    <meta
      name="twitter:description"
      content="AI가 내린 대출·카드 심사 결과에 설명을 요구하고, 유리한 정보를 내고, 다시 계산해 달라고 요구할 수 있습니다. 신용정보법 제36조의2."
    />
    <meta name="twitter:image" content="https://362.parkmiyeong.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
