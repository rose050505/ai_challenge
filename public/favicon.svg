<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="삼육이">
  <title>삼육이</title>
  <!--
    ★ 파비콘. 스캐폴드 기본 파일을 그대로 배포하고 있던 것을 교체한 것이다.
      16px 에서 읽혀야 하므로 배경 한 덩어리 + 글리프 하나로 끝낸다.
      글리프는 조문 기호 §. 이 서비스는 조문 하나(신용정보법 제36조의2)에서 나왔고
      이름도 거기서 왔다.
      색은 팔레트 그대로 — --color-ink-800 (#1e304a).
      ★ dominant-baseline 대신 y 로 베이스라인을 직접 잡는다. 브라우저별 차이가 없다.
  -->
  <rect width="64" height="64" rx="14" fill="#1e304a"/>
  <text
    x="32" y="50" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', 'Nanum Myeongjo', serif"
    font-size="52" font-weight="700" fill="#ffffff">§</text>
</svg>
